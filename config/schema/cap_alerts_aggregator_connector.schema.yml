cap_alerts_aggregator_connector.settings:
  type: config_object
  label: 'CAP Alerts Aggregator Connector settings'
  mapping:
    aggregator_secret_key:
      type: string
      label: 'Aggregator shared-secret Key ID'

cap_alerts_aggregator_connector.cap_feed_source.*:
  type: config_entity
  label: 'CAP Feed Source'
  mapping:
    id:
      type: string
      label: 'Machine name'
    label:
      type: label
      label: 'Label'
    status:
      type: boolean
      label: 'Enabled'
    feed_url:
      type: string
      label: 'Feed URL'
    feed_format:
      type: string
      label: 'Feed format'
    cap_xml_root_element:
      type: string
      label: 'CAP-XML root element name'
    credential_key:
      type: string
      label: 'Credential key ID'
    min_severity:
      type: string
      label: 'Minimum severity'
    min_certainty:
      type: string
      label: 'Minimum certainty'
    min_urgency:
      type: string
      label: 'Minimum urgency'
    category_allowlist:
      type: string
      label: 'Category allowlist'
    msgtype_denylist:
      type: string
      label: 'msgType denylist'
    agency_allowlist:
      type: string
      label: 'Agency allowlist'
    agency_denylist:
      type: string
      label: 'Agency denylist'
    require_geometry:
      type: boolean
      label: 'Require geometry'
    park_overrides:
      type: sequence
      label: 'Per-park overrides'
      sequence:
        type: mapping
        label: 'Override'
        mapping:
          gatsby_endpoint:
            type: string
            label: 'Park (gatsby_endpoint ID)'
          min_severity:
            type: string
            label: 'Minimum severity override'
          min_certainty:
            type: string
            label: 'Minimum certainty override'
          min_urgency:
            type: string
            label: 'Minimum urgency override'
          category_allowlist:
            type: string
            label: 'Category allowlist override'
          agency_allowlist:
            type: string
            label: 'Agency allowlist override'
          agency_denylist:
            type: string
            label: 'Agency denylist override'
